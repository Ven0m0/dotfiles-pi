name: ShellCheck
on:
  push:
    branches: [main]
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # error severity only: warnings in apt-ultra.sh and a few others are existing debt.
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error
